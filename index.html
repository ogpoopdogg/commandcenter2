function autoAssignDepotJobs() {
const jobsToAssign = [];
Object.entries(rawJobs).forEach(([id, job]) => {

jobsToAssign.push({id, ...job});

if(jobsToAssign.length === 0) return alert("No depot jobs to assign.");

if(index >= jobsToAssign.length) return alert("Auto-assignment complete.");

for (let zId in zoneData) {
const z = zoneData[zId];

if (z.days && !z.days.includes(currentDay)) continue;
if (z.start && z.end) {
const [sh, sm] = z.start.split(':').map(Number);
const [eh, em] = z.end.split(':').map(Number);

const endMins = eh * 60 + em;
if (currentMins < startMins || currentMins > endMins) continue;
}
let match = false;
if (z.paths) {
for(let i = 0; i < z.paths.length; i++) {
const poly = new google.maps.Polygon({ paths: z.paths[i] });

const bg = getDriverColor(p.assigned_to);

else if(currentDriverFilter) dH = `<span style="color:${bg}; font-weight:700;">${type === 'pickup' ? 'PICKUP' : 'DELIVERY'}</span>`;

let arrow = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin: 0 4px;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
let content = `<span style="color:#ffff00;">${p.name||'-'}</span>${arrow}<span style="color:#00ff00;">${p.delivery_name||'-'}</span>`;
if (type === 'delivery' || isDepot) {
    arrow = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin: 0 4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>`;
    content = `<span style="color:#00ff00;">${p.delivery_name||'-'}</span>${arrow}<span style="color:#ffff00;">${p.name||'-'}</span>`;
}
c.innerHTML = `<div style="display:flex; align-items:center; gap:8px; width:100%; font-size:13px; white-space:nowrap;">${bH}${dH}${content}</div>`;
if(currentDriverFilter) {
    let shouldShow = false;
    if (isDepot && showDepot) shouldShow = true;
    else if (!isDepot && type === 'pickup' && showPickups) shouldShow = true;
    else if (!isDepot && type === 'delivery' && showDeliveries) shouldShow = true;
    
    if (shouldShow) uList.appendChild(c);
} else if(isDepot) {
depotList.appendChild(c);
} else if (isU && !isFailed) {

} else {

}
});
const ad = document.getElementById('header-alert'), ud = document.getElementById('header-unassigned');
if(dndCount > 0) { ad.style.display = 'block'; ad.innerText = dndCount + " DND/DNP"; document.getElementById('archive-all-dnd-btn').style.display = 'block'; }
else { ad.style.display = 'none'; document.getElementById('archive-all-dnd-btn').style.display = 'none'; }
ud.style.display = pending > 0 ? 'block' : 'none'; ud.innerText = pending + " UNASSIGNED";
Object.keys(driverStats).forEach(d => {
const p = driverStats[d].p, del = driverStats[d].d;
if(p > 0 || del > 0) {
const r = document.createElement("div"); r.className = "driver-stat-row pointer"; r.onclick = () => { if (currentDriverFilter === d) clearDriverFilter(); else filterByDriver(d); };
const dur = (driverLocationsData[d]?.total_duration) || "";
r.innerHTML = `<div class="flex ac"><div class="ds-name" style="color:${getDriverColor(d)};">${d}</div>${dur ? `<span class="route-time-display">${dur}</span>` : ''}</div><div class="stat-info">${p>0?`<div class="stat-item">Pickups <span class="stat-val-p">${p}</span></div>`:''}${del>0?`<div class="stat-item">Deliveries <span class="stat-val-d">${del}</span></div>`:''}</div>`;
sPanel.appendChild(r);

});
document.getElementById("stat-pending").innerText = pending + dndCount; document.getElementById("stat-assigned").innerText = assignedCount; document.getElementById("stat-note").innerText = noteCount;
document.getElementById("note-box").style.display = noteCount > 0 ? "block" : "none";
document.getElementById("pending-box").className = "stat-box" + ((pending + dndCount) > 0 ? " unassigned-glow" : "");
['pickups', 'transit', 'depot', 'deliveries', 'dnd'].forEach(cat => {

const count = list.children.length;

    badge.innerText = count;
    if(count > 0) badge.classList.add('badge-active'); else badge.classList.remove('badge-active');
}
list.style.display = catState[cat] ? 'block' : 'none';

    if (list.querySelector('.new-card') && !catState[cat]) btn.classList.add('new-btn');

});
isFirstLoad = false;

}
function openZoneManager() {
document.getElementById('zone-modal').style.display = 'block';
showZoneSchedule();
}
function showZoneSchedule() {
document.getElementById('zone-schedule-view').style.display = 'block';
document.getElementById('zone-map-view').style.display = 'none';
renderZoneRoster();
}
function showZoneMap() {
document.getElementById('zone-schedule-view').style.display = 'none';
document.getElementById('zone-map-view').style.display = 'flex';
if (!zoneMap) initZoneMap();
else { 
google.maps.event.trigger(zoneMap, "resize"); 
zoneMap.setCenter({ lat: 49.8425, lng: -99.9497 }); 
}
renderZoneMapInterface();
}
function initZoneMap() {
zoneMap = new google.maps.Map(document.getElementById("zone-map"), { center: { lat: 49.8425, lng: -99.9497 }, zoom: 12, gestureHandling: "greedy", styles: [ { "featureType": "all", "elementType": "all", "stylers": [{ "invert_lightness": true }, { "saturation": 10 }, { "lightness": 30 }, { "gamma": 0.5 }, { "hue": "#435158" }] } ] });
drawingManager = new google.maps.drawing.DrawingManager({ drawingControl: false, polygonOptions: { editable: true } });
drawingManager.setMap(zoneMap);
google.maps.event.addListener(drawingManager, 'overlaycomplete', function(e) {
if (e.type === 'polygon' && activeDrawingDriver && activeDrawingZoneId) {
const newPoly = e.overlay;
const newPath = newPoly.getPath();
let isOverlap = false;
for(let driver in zonePolygons) {
if (driver === activeDrawingDriver) continue;
const polys = zonePolygons[driver];
for(let i=0; i<polys.length; i++) {
const existingPoly = polys[i];
for(let j=0; j<newPath.getLength(); j++) {
if(google.maps.geometry.poly.containsLocation(newPath.getAt(j), existingPoly)) isOverlap = true;
}
const exPath = existingPoly.getPath();
for(let j=0; j<exPath.getLength(); j++) {
if(google.maps.geometry.poly.containsLocation(exPath.getAt(j), newPoly)) isOverlap = true;
}
}
}
if(isOverlap) {
alert("Overlaps another driver's boundary! Please re-draw without overlapping.");
e.overlay.setMap(null);
return;
}
const path = newPath.getArray().map(p => ({ lat: p.lat(), lng: p.lng() }));
let existingPaths = [];
const z = driverZones[activeDrawingDriver] && driverZones[activeDrawingDriver][activeDrawingZoneId];
if (z && z.paths) existingPaths = z.paths;
existingPaths.push(path);
db.ref(`driver_zones/${activeDrawingDriver}/${activeDrawingZoneId}/paths`).set(existingPaths);
e.overlay.setMap(null); 
drawingManager.setDrawingMode(null);
activeDrawingDriver = null;
activeDrawingZoneId = null;
document.getElementById('active-driver-zone-panel').style.display = 'none';
renderZoneMapInterface();
}
});
}
function renderZoneRoster() {
const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
let html = '';
customDrivers.forEach((d) => {
const color = getDriverColor(d);
const driverData = driverZones[d] || {};
let zonesHtml = '';
Object.keys(driverData).forEach(zId => {
const z = driverData[zId];
let dayHtml = '<div class="day-row">';
days.forEach(day => {
const isActive = (z.days && z.days.includes(day)) ? 'day-active' : '';
dayHtml += `<div class="day-toggle ${isActive}" onclick="toggleDay('${d}', '${zId}', '${day}')">${day[0]}</div>`;
});
dayHtml += '</div>';
zonesHtml += `
<div class="zone-item">
<div class="zone-item-header">
<input type="text" value="${z.label || ''}" placeholder="Zone Label" onchange="saveZone('${d}', '${zId}', 'label', this.value)" style="width: 150px; font-size: 11px; padding: 8px; margin:0; background: transparent; color: #fff; border-bottom: 1px solid #555; border-radius: 0; border-top:0; border-left:0; border-right:0;">
<button class="btn-zone-del" onclick="deleteZone('${d}', '${zId}')">DELETE</button>
</div>
${dayHtml}
<div class="flex gap-10">
<input type="time" value="${z.start||''}" onchange="saveZone('${d}', '${zId}', 'start', this.value)" style="margin:0; padding:10px;">
<input type="time" value="${z.end||''}" onchange="saveZone('${d}', '${zId}', 'end', this.value)" style="margin:0; padding:10px;">
</div>
</div>`;
});
html += `<div class="zone-driver-row">
<div class="zone-driver-header">
<div class="zone-driver-name" style="color:${color}">${d}</div>
<button class="btn-zone-add" onclick="addZone('${d}')">+ ADD ZONE</button>
</div>
${zonesHtml}
</div>`;
});
document.getElementById('zone-roster').innerHTML = html;
}
function renderZoneMapInterface() {
if(!zoneMap) return;
for(let k in zonePolygons) { 
if(Array.isArray(zonePolygons[k])) zonePolygons[k].forEach(p=>p.setMap(null));
}
zonePolygons = {};
customDrivers.forEach((d) => {
const color = getDriverColor(d);
const driverData = driverZones[d] || {};
zonePolygons[d] = [];
Object.values(driverData).forEach(z => {
if(z.paths) {
z.paths.forEach(path => {
const poly = new google.maps.Polygon({ paths: path, map: zoneMap, fillColor: color, fillOpacity: 0.3, strokeColor: color, strokeWeight: 2 });
zonePolygons[d].push(poly);
});
}
});
});
let html = '';
customDrivers.forEach((d) => {
const color = getDriverColor(d);
html += `<button class="zone-driver-btn" onclick="selectDriverForMap('${d}', '${color}')" style="color:${color}">${d}</button>`;
});
document.getElementById('zone-driver-grid').innerHTML = html;
}
function selectDriverForMap(driver, color) {
const panel = document.getElementById('active-driver-zone-panel');
const driverData = driverZones[driver] || {};
const keys = Object.keys(driverData);
if (keys.length === 0) {
panel.innerHTML = `<div style="text-align:center; color:#777; font-size:12px;">No zones created for ${driver}. Go to Schedule view to add one.</div>`;
} else {
let html = `<div style="font-weight:700; color:${color}; text-transform:uppercase; margin-bottom:8px;">${driver} ZONES</div>`;
keys.forEach(zId => {
const z = driverData[zId];
html += `
<div class="active-zone-row">
<div class="active-zone-label">${z.label || 'Unnamed Zone'}</div>
<div style="display:flex; gap:5px;">
<button class="btn-zone" onclick="drawZoneFor('${driver}', '${zId}', '${color}')">DRAW</button>
<button class="btn-zone" onclick="clearZoneFor('${driver}', '${zId}')">CLEAR</button>
</div>
</div>`;
});
panel.innerHTML = html;
}
panel.style.display = 'block';
}
function addZone(driver) {
const newRef = db.ref('driver_zones/' + driver).push();
newRef.set({ label: 'New Zone', start: '', end: '', days: [], paths: [] });
}
function deleteZone(driver, zoneId) {
if(confirm('Delete this zone?')) {
db.ref(`driver_zones/${driver}/${zoneId}`).remove();
}
}
function toggleDay(driver, zoneId, day) {
const z = driverZones[driver][zoneId] || {};
let days = z.days || [];
if (days.includes(day)) days = days.filter(d => d !== day);
else days.push(day);
db.ref(`driver_zones/${driver}/${zoneId}/days`).set(days);
}
function saveZone(driver, zoneId, field, value) {
db.ref(`driver_zones/${driver}/${zoneId}/${field}`).set(value);
}
function drawZoneFor(driver, zoneId, color) {
const z = driverZones[driver][zoneId];
if (!z.label || z.label === 'New Zone') {
const lbl = prompt("Enter a label for this Zone (e.g., Morning Run)", z.label || "");
if (lbl) db.ref(`driver_zones/${driver}/${zoneId}/label`).set(lbl);
}
activeDrawingDriver = driver;
activeDrawingZoneId = zoneId;
drawingManager.setOptions({ polygonOptions: { fillColor: color, fillOpacity: 0.3, strokeWeight: 2, strokeColor: color, editable: true } });
drawingManager.setDrawingMode(google.maps.drawing.OverlayType.POLYGON);
}
function clearZoneFor(driver, zoneId) { 
if(confirm('Clear map area for this zone?')) {
db.ref(`driver_zones/${driver}/${zoneId}/paths`).remove();
setTimeout(() => selectDriverForMap(driver, getDriverColor(driver)), 200);
} 
}
let wakeLock = null;
async function requestWakeLock() {
try {
if ('wakeLock' in navigator) {
wakeLock = await navigator.wakeLock.request('screen');
}
} catch (err) {
console.error(err);
}
}
document.addEventListener('visibilitychange', () => {
if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
});
let deferredPrompt; const installBtn = document.getElementById('install-btn');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') installBtn.style.display = 'none'; deferredPrompt = null; } });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./firebase-messaging-sw.js').then(r => { swReg = r; messaging.useServiceWorker(r); }).catch(e => console.log('SW Error', e)));

function autoScaleText() {
    const lines = document.querySelectorAll('.history-item div[style*="white-space:nowrap"]');
    lines.forEach(line => {
        if (!line.dataset.origSize) {
            line.dataset.origSize = window.getComputedStyle(line).fontSize;
        }
        line.style.fontSize = line.dataset.origSize;
        let size = parseFloat(line.style.fontSize);
        while (line.scrollWidth > line.clientWidth && size > 8) {
            size -= 0.5;
            line.style.fontSize = size + 'px';
        }
    });
}
window.addEventListener('resize', () => setTimeout(autoScaleText, 50));

let currentLocationTarget = null;
let pickerMap = null;
let pickerAutocomplete = null;

function openLocationPicker(target) {
    currentLocationTarget = target;
    document.getElementById('location-picker-modal').style.display = 'flex';
    document.body.style.overflow = 'hidden';

    if (!pickerMap) {
        pickerMap = new google.maps.Map(document.getElementById("picker-map"), {
            center: { lat: 49.8425, lng: -99.9497 },
            zoom: 14,
            gestureHandling: "greedy",
            disableDefaultUI: true,
            zoomControl: true
        });

        const input = document.getElementById('loc-search-bar');
        pickerAutocomplete = new google.maps.places.Autocomplete(input);
        pickerAutocomplete.bindTo('bounds', pickerMap);

        pickerAutocomplete.addListener('place_changed', () => {
            const place = pickerAutocomplete.getPlace();
            if (!place.geometry || !place.geometry.location) return;
            pickerMap.setCenter(place.geometry.location);
            pickerMap.setZoom(17);
        });

        input.addEventListener('input', function() {
            const val = this.value.trim();
            const gpsRegex = /^(-?\d+(\.\d+)?)[,\s]+(-?\d+(\.\d+)?)$/;
            const match = val.match(gpsRegex);
            if (match) {
                const lat = parseFloat(match[1]);
                const lng = parseFloat(match[3]);
                if (!isNaN(lat) && !isNaN(lng)) {
                    pickerMap.setCenter({ lat: lat, lng: lng });
                    pickerMap.setZoom(17);
                }
            }
        });
    }
    setTimeout(() => {
        google.maps.event.trigger(pickerMap, 'resize');
        pickerMap.setCenter({ lat: 49.8425, lng: -99.9497 });
        document.getElementById('loc-search-bar').value = '';
    }, 100);
}

function setPickerLocation() {
    if (!pickerMap) return;
    const center = pickerMap.getCenter();
    const lat = center.lat().toFixed(5);
    const lng = center.lng().toFixed(5);
    const str = `${lat}, ${lng}`;

    if (currentLocationTarget === 'pickup') {
        document.getElementById('f-pickup').value = str;
    } else if (currentLocationTarget === 'drop') {
        document.getElementById('f-drop-address').value = str;
    }

    document.getElementById('location-picker-modal').style.display = 'none';
    document.body.style.overflow = '';
}
