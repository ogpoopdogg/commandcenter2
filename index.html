<script>
let dispatchBtn = document.getElementById('toggle-dispatch-btn');
let dispatchContent = document.getElementById('dispatch-form-content');
if (localStorage.getItem('ec_dispatch_collapsed') === 'false') {
    dispatchContent.style.display = 'block';
    dispatchBtn.classList.add('dispatch-active');
} else {
    dispatchContent.style.display = 'none';
    dispatchBtn.classList.remove('dispatch-active');
}
function toggleDispatchForm() {
    with(document){
        let a=getElementById('dispatch-form-content'),b=a.style.display==='none';
        a.style.display=b?'block':'none';
        localStorage.setItem('ec_dispatch_collapsed',b?'false':'true');
        let btn = document.getElementById('toggle-dispatch-btn');
        if (a.style.display === 'block') btn.classList.add('dispatch-active');
        else btn.classList.remove('dispatch-active');
    }
}
</script>

function toggleCat(cat) {
  const count = parseInt(document.getElementById('badge-' + cat).innerText) || 0;
  if (count === 0) return;
  const backBtn = document.getElementById('back-to-categories');
  const allColumns = document.querySelectorAll('.archive-column');
  const clickedCol = document.getElementById('btn-' + cat).closest('.archive-column');
  const isExpanded = clickedCol.classList.contains('expanded');

  if (isExpanded) {
    // Collapse: show all columns again, hide back button
    allColumns.forEach(col => col.style.display = '');
    clickedCol.classList.remove('expanded');
    backBtn.style.display = 'none';
    // Reset catState for all? We'll set all lists to their previous state
    for (let c in catState) {
      catState[c] = false;
    }
    // Hide all lists
    document.querySelectorAll('[id^="list-"]').forEach(list => list.style.display = 'none');
    document.getElementById('active-search').style.display = '';
    document.getElementById('toggle-archive-btn').style.display = '';
  } else {
    // Hide all columns first, then show the clicked one and mark it expanded
    allColumns.forEach(col => col.style.display = 'none');
    clickedCol.style.display = ''; // restore default display (block/flex)
    clickedCol.classList.add('expanded');
    backBtn.style.display = 'block';

    // Set catState: only this category true, others false
    for (let c in catState) {
      catState[c] = (c === cat);
    }

    // Show this category's list (set to grid)
    const list = document.getElementById('list-' + cat);
    list.style.display = 'grid';

    // Remove new‑card highlights as before
    const btn = document.getElementById('btn-' + cat);
    btn.classList.remove('new-btn');
    list.querySelectorAll('.new-card').forEach(card => card.classList.remove('new-card'));
    document.getElementById('active-search').style.display = 'none';
    document.getElementById('toggle-archive-btn').style.display = 'none';
  }
}
    function showAllCategories() {

  const backBtn = document.getElementById('back-to-categories');
  backBtn.style.display = 'none';

    col.style.display = '';
    col.classList.remove('expanded');
  });
  // Hide all lists (they will be shown by their individual catState)
  for (let c in catState) {

  document.getElementById('active-search').style.display = '';
  document.getElementById('toggle-archive-btn').style.display = '';
}

function resetDriverView() {
  if (!currentDriverFilter) return;
  if (!mainMap) return;

  const bounds = new google.maps.LatLngBounds();
  let hasValidBounds = false;

  // Try to include driver's current location
  const driverData = driverLocationsData[currentDriverFilter];
  if (driverData && driverData.lat && driverData.lng) {
    const pos = { lat: driverData.lat, lng: driverData.lng };
    bounds.extend(pos);
    hasValidBounds = true;
    // Include active route if available
    if (driverData.active_route) {
      try {
        const path = google.maps.geometry.encoding.decodePath(driverData.active_route);
        path.forEach(p => bounds.extend(p));
      } catch (e) {
        console.warn("Failed to decode active_route", e);
      }
    }
  }

  // If we have no driver location or route, try to include all job markers for this driver
  if (!hasValidBounds) {
    // Job markers are stored with keys like 'job_0', 'job_1', etc.
    Object.keys(mapMarkers).forEach(key => {
      if (key.startsWith('job_')) {
        const marker = mapMarkers[key];
        if (marker && marker.getPosition()) {
          bounds.extend(marker.getPosition());
          hasValidBounds = true;
        }
      }
    });
  }

  if (hasValidBounds) {
    mainMap.fitBounds(bounds);
    // If the bounds are a single point, zoom to a reasonable level
    if (bounds.getNorthEast().equals(bounds.getSouthWest())) {
      mainMap.setZoom(14);
    }
  } else {
    console.log("No bounds available for reset – map unchanged.");
  }

  // Scroll to top of page to show header and logo
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// NEW: function to check scheduled jobs and activate them if due
function checkScheduledJobs() {
    if (!rawJobs) return;
    const now = Date.now();
    Object.keys(rawJobs).forEach(jobId => {
        const job = rawJobs[jobId];
        // Only consider non‑completed jobs with a scheduled_time that is now or in the past
        if (job.status !== 'completed' && job.scheduled_time && job.scheduled_time <= now) {
            // Determine the address to use for zone check based on current status
            let address = '';
            if (job.status === 'pending_pickup' || !job.status) {
                address = (job.pickup_location ? job.pickup_location + (job.pickup_city ? ', ' + job.pickup_city : '') : '');
            } else if (job.status === 'pending_delivery' || job.status === 'in_transit') {
                address = (job.destination ? job.destination + (job.delivery_city ? ', ' + job.delivery_city : '') : '');
            } else {
                address = job.destination || job.pickup_location || '';
            }
            if (!address) return;

            // If coordinates are missing, try to geocode (but don't block on it)
            const doActivation = (lat, lng) => {
                // Determine which driver zone contains this point
                let foundDriver = null;
                if (lat && lng) {
                    const point = new google.maps.LatLng(lat, lng);
                    for (let driver in driverZones) {
                        const zones = driverZones[driver];
                        for (let zoneId in zones) {
                            const zone = zones[zoneId];
                            if (zone.paths && Array.isArray(zone.paths)) {
                                for (let path of zone.paths) {
                                    const polygon = new google.maps.Polygon({ paths: path });
                                    if (google.maps.geometry.poly.containsLocation(point, polygon)) {
                                        foundDriver = driver;
                                        break;
                                    }
                                }
                                if (foundDriver) break;
                            }
                        }
                        if (foundDriver) break;
                    }
                }

                // If no zone found, fall back to existing assignment or leave as is
                if (!foundDriver) {
                    // If already assigned, keep it; otherwise, maybe leave scheduled? We'll call autoScheduleJob to possibly reschedule.
                    if (!job.assigned_to || job.assigned_to === 'Unassigned') {
                        // No zone found and unassigned – let autoScheduleJob handle it (it will try to find a zone or reschedule)
                        autoScheduleJob(jobId);
                    }
                    return;
                }

                // Check if driver is available now based on schedule
                const zoneData = driverZones[foundDriver];
                let isAvailableNow = false;
                const nowDate = new Date();
                const dayOfWeek = nowDate.toLocaleDateString('en-US', { weekday: 'short' });
                const timeStr = nowDate.getHours().toString().padStart(2,'0') + ':' + nowDate.getMinutes().toString().padStart(2,'0');

                // Iterate through all zones for this driver to find a matching schedule (we can just check any zone)
                for (let zoneId in zoneData) {
                    const zone = zoneData[zoneId];
                    const days = zone.days || [];
                    const start = zone.start || '00:00';
                    const end = zone.end || '23:59';
                    if (days.length === 0 || days.includes(dayOfWeek)) {
                        if (timeStr >= start && timeStr <= end) {
                            isAvailableNow = true;
                            break;
                        }
                    }
                }

                if (isAvailableNow) {
                    // Activate the job: set appropriate status, assign driver, add history
                    let newStatus = '';
                    if (job.status === 'pending_pickup' || !job.status) {
                        newStatus = 'pending_pickup';
                    } else if (job.status === 'pending_delivery' || job.status === 'in_transit') {
                        newStatus = 'pending_delivery';
                    } else {
                        newStatus = 'pending_pickup'; // fallback
                    }
                    const updates = {
                        status: newStatus,
                        assigned_to: foundDriver,
                        scheduled_time: null, // clear scheduled time to avoid re‑processing
                        job_history: (job.job_history ? job.job_history + '\n' : '') + `[Auto‑activated from scheduled time at ${new Date().toLocaleString()}]`
                    };
                    db.ref('jobs').child(jobId).update(updates);
                } else {
                    // Driver not available now – reschedule via autoScheduleJob
                    autoScheduleJob(jobId);
                }
            };

            if (job.lat && job.lng) {
                doActivation(job.lat, job.lng);
            } else {
                // Geocode to get coordinates
                const geocoder = new google.maps.Geocoder();
                geocoder.geocode({ address: address }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        const loc = results[0].geometry.location;
                        const lat = loc.lat();
                        const lng = loc.lng();
                        // Save coordinates for future use
                        db.ref('jobs').child(jobId).update({ lat, lng }).then(() => {
                            doActivation(lat, lng);
                        });
                    } else {
                        // Geocoding failed – cannot determine zone, so just call autoScheduleJob (it may reschedule or leave as is)
                        autoScheduleJob(jobId);
                    }
                });
            }
        }
    });
}

// --- New auto‑schedule functions (begin) ---
function autoScheduleJob(jobId) {
    db.ref('jobs').child(jobId).once('value').then(snap => {
        const job = snap.val();
        if (!job || job.status === 'completed') return;
        // Determine address to geocode
        let address = '';
        if (job.status === 'pending_pickup') {
            address = (job.pickup_location ? job.pickup_location + (job.pickup_city ? ', ' + job.pickup_city : '') : '');
        } else if (job.status === 'pending_delivery' || job.status === 'in_transit') {
            address = (job.destination ? job.destination + (job.delivery_city ? ', ' + job.delivery_city : '') : '');
        } else {
            address = job.destination || job.pickup_location || '';
        }
        if (!address) return;

        if (job.lat && job.lng) {
            checkZonesAndSchedule(job, job.lat, job.lng, jobId);
        } else {
            geocodeAddress(address, (lat, lng) => {
                if (lat && lng) {
                    db.ref('jobs').child(jobId).update({ lat, lng }).then(() => {
                        checkZonesAndSchedule(job, lat, lng, jobId);
                    });
                }
            });
        }
    });
}

function geocodeAddress(address, callback) {
    const geocoder = new google.maps.Geocoder();
    geocoder.geocode({ address: address }, (results, status) => {
        if (status === 'OK' && results[0]) {
            const loc = results[0].geometry.location;
            callback(loc.lat(), loc.lng());
        } else {
            console.warn('Geocoding failed for', address);
            callback(null, null);
        }
    });
}

function checkZonesAndSchedule(job, lat, lng, jobId) {
    const point = new google.maps.LatLng(lat, lng);
    let foundDriver = null;
    let foundZoneId = null;
    let foundZone = null;
    // Iterate drivers
    for (let driver in driverZones) {
        const zones = driverZones[driver];
        for (let zoneId in zones) {
            const zone = zones[zoneId];
            if (zone.paths && Array.isArray(zone.paths)) {
                for (let path of zone.paths) {
                    const polygon = new google.maps.Polygon({ paths: path });
                    if (google.maps.geometry.poly.containsLocation(point, polygon)) {
                        foundDriver = driver;
                        foundZoneId = zoneId;
                        foundZone = zone;
                        break;
                    }
                }
                if (foundDriver) break;
            }
        }
        if (foundDriver) break;
    }
    if (!foundDriver) return; // no zone found, leave as is

    // Check if driver is available now based on schedule
    const nowDate = new Date();
    const dayOfWeek = nowDate.toLocaleDateString('en-US', { weekday: 'short' });
    
    // Convert current time to minutes for easier comparison
    const currentMinutes = nowDate.getHours() * 60 + nowDate.getMinutes();

    const days = foundZone.days || [];
    const startStr = foundZone.start || '00:00';
    const endStr = foundZone.end || '23:59';
    
    // Convert start and end times to minutes
    const [startHour, startMinute] = startStr.split(':').map(Number);
    const [endHour, endMinute] = endStr.split(':').map(Number);
    const startMinutes = startHour * 60 + startMinute;
    const endMinutes = endHour * 60 + endMinute;
    
    const isDayValid = days.length === 0 || days.includes(dayOfWeek);
    
    // Check if current time is within the range (handles overnight schedules if needed)
    let isTimeValid;
    if (endMinutes >= startMinutes) {
        // Normal schedule (e.g., 09:00-17:00)
        isTimeValid = currentMinutes >= startMinutes && currentMinutes <= endMinutes;
    } else {
        // Overnight schedule (e.g., 22:00-06:00)
        isTimeValid = currentMinutes >= startMinutes || currentMinutes <= endMinutes;
    }

    if (isDayValid && isTimeValid) {
        // Current time is valid: assign immediately and do not reschedule
        if (job.assigned_to !== foundDriver) {
            db.ref('jobs').child(jobId).update({ assigned_to: foundDriver });
        }
        return; // EXIT – no rescheduling
    }

    // --- Rescheduling logic (only runs if current time NOT valid) ---
    let scheduledTime = job.scheduled_time ? new Date(job.scheduled_time) : new Date();
    if (scheduledTime < nowDate) {
        scheduledTime = nowDate;
    }
    const maxDays = 60;
    for (let i = 0; i <= maxDays; i++) {
        let checkDate = new Date(scheduledTime);
        checkDate.setDate(scheduledTime.getDate() + i);
        const checkDay = checkDate.toLocaleDateString('en-US', { weekday: 'short' });
        if (days.length === 0 || days.includes(checkDay)) {
            let [hour, minute] = (startStr || '09:00').split(':').map(Number);
            let candidate = new Date(checkDate);
            candidate.setHours(hour, minute, 0, 0);
            if (candidate >= scheduledTime) {
                let updates = {
                    scheduled_time: candidate.getTime(),
                    assigned_to: foundDriver,
                    job_history: (job.job_history ? job.job_history + '\n' : '') + `[Auto-rescheduled to ${candidate.toLocaleString()} due to driver availability]`
                };
                db.ref('jobs').child(jobId).update(updates);
                return;
            }
        }
    }
    console.warn('No available slot found for job', jobId);
}

function computeNextGeneration(current, pattern) {
    let next = new Date(current);
    let type = pattern.type;
    let interval = pattern.interval || 1;
    if (type === 'daily') {
        next.setDate(next.getDate() + interval);
    } else if (type === 'weekly') {
        // Find next day from pattern.days (array of day names)
        let days = pattern.days || [];
        if (days.length === 0) {
            // default to interval weeks
            next.setDate(next.getDate() + interval * 7);
        } else {
            // simplistic: find next day in same week, else next week
            const dayMap = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
            let currentDay = next.getDay();
            let targetDays = days.map(d => dayMap[d]).sort((a,b)=>a-b);
            let found = false;
            for (let d of targetDays) {
                if (d > currentDay) {
                    next.setDate(next.getDate() + (d - currentDay));
                    found = true;
                    break;
                }
            }
            if (!found) {
                // next week first day
                next.setDate(next.getDate() + (7 - currentDay + targetDays[0]));
            }
            // apply interval weeks
            if (interval > 1) {
                next.setDate(next.getDate() + (interval-1)*7);
            }
        }
    } else if (type === 'monthly') {
        next.setMonth(next.getMonth() + interval);
    }
    return next.getTime();
}
function checkAndGenerateRecurringJobs() {
    const now = Date.now();
    db.ref('recurring_schedules').orderByChild('next_generation').endAt(now).once('value', snap => {
        const schedules = snap.val();
        if (!schedules) return;
        for (let id in schedules) {
            let s = schedules[id];
            if (!s.active) continue;
            if (s.next_generation && s.next_generation <= now) {
                // Generate a new job key
                const newJobKey = db.ref('jobs').push().key;
                let jobDetails = s.details || {};
                let job = {
                    ...jobDetails,
                    scheduled_time: s.next_generation,
                    recurring_id: id,
                    status: 'pending_pickup',
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    created_by: currentUser,
                    last_edit_by: currentUser
                };
                let next = computeNextGeneration(s.next_generation, s.pattern);
                let updates = {};
                updates[`/jobs/${newJobKey}`] = job;
                updates[`/recurring_schedules/${id}/next_generation`] = next;
                if (s.end_date && next > s.end_date) {
                    updates[`/recurring_schedules/${id}/active`] = false;
                }
                db.ref().update(updates).then(() => {
                    autoScheduleJob(newJobKey);
                }).catch(err => console.warn('Failed to create recurring job', err));
            }
        }
    });
}

function openLocationPicker(a) {
    with(document) {
        currentLocationTarget = a;
        getElementById('location-picker-modal').style.display = 'flex';
        body.style.overflow = 'hidden';
        if (!pickerMap) {
            pickerMap = new google.maps.Map(getElementById("picker-map"), {
                center: { lat: 49.8425, lng: -99.9497 },
                zoom: 14,
                gestureHandling: "greedy",
                disableDefaultUI: true,
                zoomControl: true
            });
            let b = getElementById('loc-search-bar');
            pickerAutocomplete = new google.maps.places.Autocomplete(b, {
                componentRestrictions: { country: 'ca' }
            });
            pickerAutocomplete.bindTo('bounds', pickerMap);
            pickerAutocomplete.addListener('place_changed', () => {
                let { geometry } = pickerAutocomplete.getPlace();
                if (!geometry || !geometry.location) return;
                pickerMap.setCenter(geometry.location);
                pickerMap.setZoom(17);
            });
            b.addEventListener('input', function() {
                let c = this.value.trim(),
                    d = /^(-?\d+(\.\d+)?)[,\s]+(-?\d+(\.\d+)?)$/,
                    e = c.match(d);
                if (e) {
                    let f = parseFloat(e[1]), g = parseFloat(e[3]);
                    if (!isNaN(f) && !isNaN(g)) {
                        pickerMap.setCenter({ lat: f, lng: g });
                        pickerMap.setZoom(17);
                    }
                }
            });
            // Get user's location for map centering and result biasing
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userPos = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        pickerMap.setCenter(userPos);
                        const circle = new google.maps.Circle({
                            center: userPos,
                            radius: 50000
                        });
                        pickerAutocomplete.setBounds(circle.getBounds());
                    },
                    (error) => {
                        console.warn("Geolocation error:", error);
                    }
                );
            }

            // --- NEW: Attach search button and Enter key handlers (only once) ---
            if (!window._searchListenersAttached) {
                const searchBtn = document.getElementById('search-location-btn');
                if (searchBtn) {
                    searchBtn.addEventListener('click', searchLocation);
                    document.getElementById('loc-search-bar').addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            searchLocation();
                        }
                    });
                    window._searchListenersAttached = true;
                }
            }
            // --- END NEW ---
        }
        setTimeout(() => {
            google.maps.event.trigger(pickerMap, 'resize');
            getElementById('loc-search-bar').value = '';
            getElementById('loc-search-bar').focus();
        }, 100);
    }
}
function searchLocation() {
    const input = document.getElementById('loc-search-bar');
    const query = input.value.trim();
    if (!query) return;

    const geocoder = new google.maps.Geocoder();
    geocoder.geocode({ address: query }, (results, status) => {
        if (status === 'OK' && results[0]) {
            const location = results[0].geometry.location;
            pickerMap.setCenter(location);
            pickerMap.setZoom(17);
        } else {
            alert('Location not found');
        }
    });
}
function setPickerLocation(){if(!pickerMap)return;let a=pickerMap.getCenter(),b=a.lat().toFixed(5),c=a.lng().toFixed(5),d=`${b}, ${c}`;with(document){const t={pickup:'f-pickup',drop:'f-drop-address'};t[currentLocationTarget]&&(getElementById(t[currentLocationTarget]).value=d);getElementById('location-picker-modal').style.display='none';body.style.overflow=''}}
// Placeholder for datetime-local input
function setupScheduledPlaceholder() {
    var input = document.getElementById('f-scheduled-time');
    if (!input) return;
    var wrap = input.closest('.input-wrap');
    if (!wrap) return;
    var placeholder = wrap.querySelector('.datetime-placeholder');
    if (!placeholder) {
        placeholder = document.createElement('span');
        placeholder.className = 'datetime-placeholder';
        placeholder.innerHTML = '📅 Schedule time';
        wrap.appendChild(placeholder);
    }
    function updatePlaceholder() {
        placeholder.style.display = input.value ? 'none' : 'block';
    }
    input.addEventListener('input', updatePlaceholder);
    input.addEventListener('change', updatePlaceholder);
    input.addEventListener('blur', updatePlaceholder);
    updatePlaceholder();
}
setupScheduledPlaceholder();
