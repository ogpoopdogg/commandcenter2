<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E&C COMMAND CENTER</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#cca300">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2 style="color: var(--accent); font-weight: 900; letter-spacing: 1px; margin-top:0;">COMMAND LOGIN</h2>
        <input type="email" id="login-user" class="login-input" placeholder="Email" autofocus>
        <input type="password" id="login-pin" class="login-input" placeholder="Password">
        <button class="login-submit" onclick="attemptLogin()">Authorize</button>
    </div>
</div>

<header>
    <div style="display: flex; flex-direction: column; width: 100%;">
        <div id="user-display"></div>
        <div style="display: flex; align-items: center; cursor: pointer;" onclick="toggleTheme()">
            <div class="crt-animate" style="display: flex; align-items: center;">
                <img src="icon2.png" class="header-logo" alt="E&C Logo">
                <span class="shiny-text" style="font-size: 18px; font-weight: 800; white-space: nowrap; letter-spacing: 1px;">E&C COMMAND</span>
            </div>
            <div style="display:flex; flex-direction:column; margin-left:15px; justify-content:center;">
                <div id="header-unassigned" style="display:none; color:#ff8c00; font-weight:900; animation:dot-pulse 1s infinite; font-size:11px; margin-bottom:2px;"></div>
                <div id="header-alert" style="display:none; color:red; font-weight:900; animation:dot-pulse 1s infinite; font-size:11px;"></div>
            </div>
        </div>
    </div>
    <div id="clock" style="font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums;"></div>
</header>

<div id="entry-panel">
    <div class="mode-switch-container">
        <button class="mode-btn active-mode" id="btn-mode-pickup" onclick="setMode('pickup')">Schedule Pickup</button>
        <button class="mode-btn" id="btn-mode-delivery" onclick="setMode('delivery')">Schedule Delivery</button>
    </div>

    <div id="top-input-section"></div>
    
    <div class="input-wrap" style="margin-bottom:6px;">
        <input type="text" id="f-pkg-details" class="glow-field" placeholder="Packages/Items/Dimensions" style="margin-bottom:0;">
        <button class="copy-btn" onclick="copyField('f-pkg-details')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
    </div>

    <div class="input-wrap" style="margin-bottom:6px;">
        <input type="text" id="f-po" placeholder="PO / Reference" style="margin-bottom:0; width:100%;">
        <button class="copy-btn" onclick="copyField('f-po')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
    </div>
    <div class="input-wrap" style="margin-bottom:6px;">
        <input type="text" id="f-info" placeholder="Driver Notes..." style="margin-bottom:0; width:100%;">
        <button class="copy-btn" onclick="copyField('f-info')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
    </div>

    <div id="bottom-input-section" style="margin-top: 5px;"></div>

    <select id="f-driver" class="driver-select" style="margin-bottom: 15px; border: 1px solid var(--accent);">
        <option value="Unassigned" selected disabled hidden>Assign Driver</option>
        <option value="Unassigned">UNASSIGNED</option>
        <option value="Matt">Matt</option>
        <option value="Touch">Touch</option>
        <option value="Julian">Julian</option>
        <option value="Jess">Jess</option>
        <option value="Alysha">Alysha</option>
        <option value="Kayla">Kayla</option>
    </select>
    <div style="display: flex; gap: 12px;">
        <button class="primary super-dispatch" onclick="createJob()" style="flex: 1;">Dispatch</button>
        <button id="voice-btn" onclick="startVoiceEntry()" style="width: 60px; background: #111; border: 1px solid #444; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg id="mic-icon" viewBox="0 0 24 24" width="24" height="24" style="fill: #888; transition: 0.3s;"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
    </div>
    
    <div style="display: flex; justify-content: space-around; align-items: center; gap: 10px; margin-top: 15px;">
        <div id="pending-box" class="stat-box" onclick="requestNotifyPermission()" style="cursor:pointer;">
            <span class="stat-label">Pending</span>
            <div id="stat-pending" class="stat-number">0</div>
        </div>

        <div class="stat-box">
            <button id="locate-btn" onclick="openMap()">Driver Map</button>
        </div>

        <div id="assigned-box" class="stat-box">
            <span class="stat-label">Assigned</span>
            <div id="stat-assigned" class="stat-number">0</div>
        </div>
        <div id="note-box" class="stat-box" style="display:none;"><span class="stat-label">Note</span><div id="stat-note" class="stat-number">0</div></div>
    </div>
</div>

<div id="driver-stats-panel"></div>
<button id="toggle-active-btn" class="primary" style="margin: 0 15px 15px; width: calc(100% - 30px);" onclick="toggleActiveList()">Active Pickups/Deliveries</button>
<button id="toggle-dnd-btn" class="primary" style="margin: 0 15px 15px; width: calc(100% - 30px);" onclick="toggleDNDList()">Active DND/DNP</button>

<div style="display:none;">
    <div id="group-pickup">
        <div style="position:relative;">
            <input type="text" id="f-name" class="glow-field" placeholder="Pickup Business/Contact Name" autocomplete="off" oninput="handleNameInput(this.value)" onblur="setTimeout(()=>document.getElementById('suggestions').style.display='none', 200)">
            <button class="copy-btn" onclick="copyField('f-name')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
            <div id="suggestions" class="suggestions-box"></div>
            <div onclick="resetFormFields()" style="position:absolute; right:40px; top:50%; transform:translateY(-50%); font-size:10px; font-weight:800; cursor:pointer; color:#666; text-transform:uppercase; z-index:10;">RESET</div>
        </div>
        <div class="flex-row">
            <div class="input-wrap" style="flex: 2;">
                <input type="text" id="f-pickup" class="glow-field" placeholder="Pickup Address" style="margin-bottom:0; width:100%;">
                <button class="copy-btn" onclick="copyField('f-pickup')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
            </div>
            <div class="input-wrap" style="flex: 1;">
                <input type="text" id="f-city" class="glow-field" placeholder="City/Town" style="margin-bottom:0; width:100%;" oninput="handleCityInput(this.value, 'pickup')" onblur="setTimeout(()=>document.getElementById('city-suggestions-p').style.display='none', 200)">
                <button class="copy-btn" onclick="copyField('f-city')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                <div id="city-suggestions-p" class="suggestions-box"></div>
            </div>
        </div>
        <div class="flex-row">
            <div class="input-wrap" style="flex:1.5;">
                <input type="email" id="f-customer-email-p" class="glow-field" placeholder="Email" style="margin-bottom:0; width:100%;">
                <button class="copy-btn" onclick="copyField('f-customer-email-p')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
            </div>
            <div class="input-wrap" style="flex:1;">
                <input type="tel" id="f-customer-phone-p" class="glow-field" placeholder="Phone Number" oninput="formatPhone(this)" style="margin-bottom:0; width:100%;">
                <button class="copy-btn" onclick="copyField('f-customer-phone-p')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
            </div>
        </div>
    </div>

    <div id="group-drop">
        <div style="position:relative;">
            <input type="text" id="f-drop-name" class="glow-field" placeholder="Delivery Contact/Business Name" autocomplete="off" oninput="handleDropNameInput(this.value)" onblur="setTimeout(()=>document.getElementById('drop-suggestions').style.display='none', 200)">
            <button class="copy-btn" onclick="copyField('f-drop-name')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
            <div id="drop-suggestions" class="suggestions-box"></div>
            <div onclick="resetFormFields()" style="position:absolute; right:40px; top:50%; transform:translateY(-50%); font-size:10px; font-weight:800; cursor:pointer; color:#666; text-transform:uppercase; z-index:10;">RESET</div>
        </div>
        <div class="flex-row">
            <div class="input-wrap" style="flex: 2;">
                <input type="text" id="f-drop-address" class="glow-field" placeholder="Delivery Address" style="margin-bottom:0; width:100%;">
                <button class="copy-btn" onclick="copyField('f-drop-address')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
            </div>
            <div class="input-wrap" style="flex: 1;">
                <input type="text" id="f-drop-city" class="glow-field" placeholder="City/Town" style="margin-bottom:0; width:100%;" oninput="handleCityInput(this.value, 'drop')" onblur="setTimeout(()=>document.getElementById('city-suggestions-d').style.display='none', 200)">
                <button class="copy-btn" onclick="copyField('f-drop-city')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                <div id="city-suggestions-d" class="suggestions-box"></div>
            </div>
        </div>
        <div class="flex-row">
            <div class="input-wrap" style="flex:1.5;">
                <input type="email" id="f-customer-email-d" class="glow-field" placeholder="Email" style="margin-bottom:0; width:100%;">
                <button class="copy-btn" onclick="copyField('f-customer-email-d')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
            </div>
            <div class="input-wrap" style="flex:1;">
                <input type="tel" id="f-customer-phone-d" class="glow-field" placeholder="Phone Number" oninput="formatPhone(this)" style="margin-bottom:0; width:100%;">
                <button class="copy-btn" onclick="copyField('f-customer-phone-d')"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
            </div>
        </div>
    </div>
</div>

<div id="board-panel">
    <div class="history-box" id="active-list-container">
        <div id="filter-reset-ui" style="width:100%; text-align:center; display:none; margin-bottom:15px;">
            <div id="selected-driver-label" style="display:none; margin: 0 auto 25px auto; width:fit-content; font-size:20px; font-weight:900; padding:8px 24px; border-radius:4px; text-transform:uppercase; background:#111; box-shadow: 0 0 15px rgba(0,0,0,0.5);"></div>
            <div style="display:flex; justify-content:center; gap:15px;">
                <button id="view-route-btn" class="route-btn" style="display:none;">View Current Route</button>
                <button onclick="clearDriverFilter()" class="back-to-all-btn">Back to All</button>
            </div>
        </div>
        <div class="archive-column">
            <div class="archive-title" style="color:var(--archive-orange);">Pickups</div>
            <div id="list-pickups"></div>
        </div>
        <div class="archive-column">
            <div class="archive-title" style="color:var(--active-green);">Deliveries</div>
            <div id="list-deliveries"></div>
        </div>
        <button onclick="toggleActiveList()" style="width:100%; margin-top:15px; background:var(--btn-bg); color:var(--text); border:1px solid var(--border); padding:12px; font-weight:800; cursor:pointer; border-radius:6px; text-transform:uppercase;">Minimize Pickups/Deliveries List</button>
    </div>

    <div class="history-box" id="dnd-list-container" style="display:none; flex-direction:column;">
        <div class="archive-title" style="color:#ff4444;">Active DND/DNP</div>
        <button id="archive-all-dnd-btn" onclick="archiveAllDND()" style="background:#b71c1c; color:#fff; border:none; padding:10px; font-weight:800; cursor:pointer; border-radius:6px; text-transform:uppercase; margin-bottom:15px; display:none;">Archive All Failed</button>
        <div id="list-dnd"></div>
        <button onclick="toggleDNDList()" style="width:100%; margin-top:15px; background:var(--btn-bg); color:var(--text); border:1px solid var(--border); padding:12px; font-weight:800; cursor:pointer; border-radius:6px; text-transform:uppercase;">Minimize Active DND/DNP</button>
    </div>

    <div style="margin-top: 30px; padding: 15px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 0 8px rgba(255,255,255,0.2);">
        <div class="archive-title" style="color: #666; border-bottom:none;">ARCHIVE (COMPLETED - TODAY ONLY)</div>
        <div class="flex-row" style="margin-bottom: 15px;">
             <select id="af-driver" class="driver-select" style="margin-bottom:0; flex:1;" onchange="renderData()">
                <option value="">All</option>
                <option value="Unassigned">Unassigned</option>
                <option value="Matt">Matt</option>
                <option value="Touch">Touch</option>
                <option value="Julian">Julian</option>
                <option value="Jess">Jess</option>
                <option value="Alysha">Alysha</option>
                <option value="Kayla">Kayla</option>
            </select>
            <input id="af-name" placeholder="Name" class="glow-field" style="margin-bottom:0; flex:1;" onkeyup="renderData()">
            <input id="af-city" placeholder="City" class="glow-field" style="margin-bottom:0; flex:1;" onkeyup="renderData()">
        </div>
        <input id="af-manual-search" placeholder="Manual Search (Today's Archive)..." class="glow-field" style="margin-bottom:15px;" onkeyup="renderData()" onfocus="document.getElementById('board-panel').scrollIntoView({behavior:'smooth'})">
        <div id="list-archive" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
</div>

<div id="map-modal">
    <button class="close-map" onclick="closeMap()">CLOSE MAP</button>
    <button class="close-map" onclick="zoomToAll()" style="top:130px; background:#448800;">ZOOM OUT</button>
    <button class="close-map" onclick="toggleDrawingMode()" style="top:180px; background:#cc5200;">DRAW ZONES</button>
    <div id="route-time-badge" style="position:absolute; top:70px; left:20px; z-index:3001; background:rgba(0,0,0,0.8); color:var(--active-green); padding:12px; border-radius:6px; font-weight:800; border:1px solid var(--active-green); display:none;"></div>
    <div id="map-driver-head" style="position:absolute; top:15px; right:80px; z-index:3001; background:#000; border:1px solid #fff; padding:6px 12px; font-weight:900; font-size:16px; display:none; box-shadow:0 4px 15px rgba(0,0,0,0.5); white-space:nowrap;"></div>
    <div id="route-list"></div>
    <div id="map"></div>
</div>

<div id="detailsModal" class="modal" onclick="this.style.display='none';document.body.style.overflow=''">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="m-title" style="color:var(--accent); margin-top:0; font-size: 18px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;">Job Details</h2>
        <div id="m-body"></div>
        </div>
</div>

<button id="install-btn">Install App</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDltbEbiqlyQjyaGth0AzIkfLpOYr96YeQ&libraries=geometry,drawing"></script>

<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
